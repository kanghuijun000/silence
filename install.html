<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <meta name="description" content="소리를 관리하며 지하 미로에서 탈출하라. SILENCE 3D 공포 탈출 게임을 설치하세요.">
  <meta property="og:title" content="SILENCE 앱 설치">
  <meta property="og:description" content="소리를 내면, 그것이 찾아온다. SILENCE 3D 공포 탈출 게임을 설치하세요.">
  <meta property="og:url" content="https://kanghuijun000.github.io/silence/install.html">
  <link rel="canonical" href="https://kanghuijun000.github.io/silence/install.html">
  <link rel="icon" href="./silence-app-icon.svg" type="image/svg+xml" sizes="any">
  <link rel="shortcut icon" href="./icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-512.png">
  <link rel="manifest" href="./manifest.json">
  <title>SILENCE 설치</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,#17212b 0,#080b10 58%);color:#e8edf2;font-family:Arial,"Noto Sans KR",sans-serif}
    main{width:min(100%,430px);text-align:center}
    .icon{width:112px;height:112px;object-fit:cover;border-radius:25px;border:1px solid #aebdca35;box-shadow:0 18px 55px #0009}
    .eyebrow{margin:28px 0 8px;color:#9aa9b7;font-size:11px;letter-spacing:3px}
    h1{margin:0;font-size:clamp(42px,12vw,60px);letter-spacing:8px}
    .tagline{margin:12px 0 30px;color:#aab5bf;font-size:14px;line-height:1.7}
    .install{width:100%;min-height:54px;border:1px solid #d7e2eb;background:#e7edf2;color:#101820;border-radius:9px;font-size:16px;font-weight:800;cursor:pointer}
    .install:disabled{opacity:.65;cursor:default}
    .open{display:block;margin-top:13px;padding:15px;border:1px solid #66758266;border-radius:9px;color:#d5dfe7;text-decoration:none;font-size:14px}
    .hint{min-height:44px;margin:18px 0 0;color:#8e9ba7;font-size:12px;line-height:1.7}
    .share{margin-top:12px;border:0;background:transparent;color:#aebbc6;text-decoration:underline;text-underline-offset:4px;font-size:13px;padding:10px;cursor:pointer}
    .foot{margin-top:34px;color:#65727e;font-size:10px;letter-spacing:1px}
  </style>
</head>
<body>
  <main>
    <img class="icon" src="./icon-512.png" alt="SILENCE 앱 아이콘">
    <div class="eyebrow">A FIRST-PERSON HORROR ESCAPE</div>
    <h1>SILENCE</h1>
    <p class="tagline">소리를 내면, 그것이 찾아온다.<br>어둠 속 지하 미로에서 살아남아 탈출하세요.</p>
    <button class="install" id="installBtn" type="button">앱 설치하기</button>
    <a class="open" href="./">웹에서 바로 플레이</a>
    <p class="hint" id="hint" aria-live="polite">설치 버튼을 눌러 SILENCE를 기기에 추가하세요.</p>
    <button class="share" id="shareBtn" type="button">설치 링크 공유하기</button>
    <div class="foot">SILENCE · FREE HORROR ESCAPE GAME</div>
  </main>
  <script>
    const INSTALL_URL='https://kanghuijun000.github.io/silence/install.html';
    let installPrompt=null;
    const installBtn=document.getElementById('installBtn');
    const hint=document.getElementById('hint');
    const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
    const isAppWindow=window.matchMedia('(display-mode: standalone)').matches
      ||window.matchMedia('(display-mode: fullscreen)').matches
      ||window.navigator.standalone===true;

    installBtn.disabled=true;

    window.addEventListener('beforeinstallprompt',event=>{
      event.preventDefault();
      installPrompt=event;
      if(!isAppWindow){
        installBtn.disabled=false;
        installBtn.textContent='정식 앱으로 설치하기';
        hint.textContent='SILENCE를 독립 앱으로 설치할 수 있어요. 아래 버튼을 눌러 설치하세요.';
      }
    });

    window.addEventListener('appinstalled',()=>{
      installPrompt=null;
      installBtn.disabled=true;
      installBtn.textContent='설치 완료';
      hint.textContent='설치가 완료됐어요. 홈 화면의 SILENCE 아이콘으로 실행하세요.';
    });

    if(isAppWindow){
      installBtn.textContent='앱에서 실행 중';
      hint.textContent='SILENCE 앱 창에서 열렸어요.';
    }else if(isIOS){
      installBtn.textContent='iOS 설치 안내';
      hint.textContent='Safari 공유 메뉴에서 ‘홈 화면에 추가’를 이용하세요.';
    }else{
      installBtn.textContent='설치 가능 여부 확인 중';
      hint.textContent='Chrome이 정식 앱 설치를 지원하는지 확인하고 있어요.';
      window.setTimeout(()=>{
        if(!installPrompt&&!isAppWindow){
          installBtn.disabled=true;
          installBtn.textContent='정식 설치를 사용할 수 없음';
          hint.textContent='Chrome에서 정식 앱 설치 요청이 확인되지 않았어요. Chrome 메뉴에 ‘앱 설치’가 표시될 때만 설치하세요. ‘홈 화면에 추가’는 Chrome 바로가기를 만들 수 있어 최근 앱 아이콘이 Chrome으로 남을 수 있어요.';
        }
      },2500);
    }

    installBtn.addEventListener('click',async()=>{
      if(isAppWindow||!installPrompt)return;
      const prompt=installPrompt;
      installPrompt=null;
      try{
        await prompt.prompt();
        const choice=await prompt.userChoice;
        if(choice.outcome==='accepted'){
          installBtn.textContent='설치 진행 중';
          installBtn.disabled=true;
          hint.textContent='설치가 끝나면 홈 화면의 SILENCE 아이콘으로 실행하세요.';
        }else{
          installBtn.disabled=false;
          installBtn.textContent='정식 앱으로 설치하기';
          hint.textContent='설치가 취소됐어요. 원할 때 다시 시도할 수 있어요.';
        }
      }catch(error){
        installBtn.disabled=true;
        installBtn.textContent='설치 요청 실패';
        hint.textContent='Chrome이 설치 요청을 처리하지 못했어요. 페이지를 새로고침한 뒤 다시 확인하세요.';
      }
    });

    document.getElementById('shareBtn').addEventListener('click',async()=>{
      try{
        if(navigator.share) await navigator.share({title:'SILENCE 앱 설치',text:'SILENCE 3D 공포 탈출 게임을 설치해 보세요.',url:INSTALL_URL});
        else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(INSTALL_URL);hint.textContent='설치 링크를 복사했어요.';}
        else{hint.textContent='주소창의 설치 링크를 복사해 공유하세요.';}
      }catch(error){if(error.name!=='AbortError')hint.textContent='설치 링크를 복사해 공유하세요.';}
    });

    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});
    }
  </script>
</body>
</html>
